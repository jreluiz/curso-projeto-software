<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="max-width: 1100px; background-color: transparent;" viewBox="0 0 1100 390" role="graphics-document document" aria-roledescription="quadrantChart"><style>#my-svg{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:hsl(220.5882352941, 100%, 98.3333333333%);}#my-svg .error-text{fill:rgb(8.5000000002, 5.7500000001, 0);stroke:rgb(8.5000000002, 5.7500000001, 0);}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#0b0b0b;stroke:#0b0b0b;}#my-svg .marker.cross{stroke:#0b0b0b;}#my-svg svg{font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:16px;}#my-svg p{margin:0;}#my-svg .node .neo-node{stroke:hsl(40.5882352941, 60%, 83.3333333333%);}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#my-svg [data-look="neo"].node path{stroke:url(#my-svg-gradient);stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node .neo-line path{stroke:hsl(40.5882352941, 60%, 83.3333333333%);filter:none;}#my-svg [data-look="neo"].node circle{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg :root{--mermaid-font-family:Helvetica Neue,Helvetica,Arial,sans-serif;}</style><g/><g class="main"><g class="quadrants"><g class="quadrant"><rect x="565" y="6" width="529" height="174" fill="#cfe6e2"/><text x="0" y="0" fill="#0f766e" font-size="24" dominant-baseline="hanging" text-anchor="middle" transform="translate(829.5, 11) rotate(0)">GERENCIAR DE PERTO</text></g><g class="quadrant"><rect x="36" y="6" width="529" height="174" fill="#e7f2f0"/><text x="0" y="0" fill="#0f766e" font-size="24" dominant-baseline="hanging" text-anchor="middle" transform="translate(300.5, 11) rotate(0)">MANTER SATISFEITO</text></g><g class="quadrant"><rect x="36" y="180" width="529" height="174" fill="#f6f4ef"/><text x="0" y="0" fill="#0f766e" font-size="24" dominant-baseline="hanging" text-anchor="middle" transform="translate(300.5, 185) rotate(0)">MONITORAR</text></g><g class="quadrant"><rect x="565" y="180" width="529" height="174" fill="#e7f2f0"/><text x="0" y="0" fill="#0f766e" font-size="24" dominant-baseline="hanging" text-anchor="middle" transform="translate(829.5, 185) rotate(0)">MANTER INFORMADO</text></g></g><g class="border"><line x1="35" y1="6" x2="1095" y2="6" style="stroke: rgb(15, 118, 110); stroke-width: 2;"/><line x1="1094" y1="7" x2="1094" y2="353" style="stroke: rgb(15, 118, 110); stroke-width: 2;"/><line x1="35" y1="354" x2="1095" y2="354" style="stroke: rgb(15, 118, 110); stroke-width: 2;"/><line x1="36" y1="7" x2="36" y2="353" style="stroke: rgb(15, 118, 110); stroke-width: 2;"/><line x1="565" y1="7" x2="565" 